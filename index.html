</style></head><body><main class="wrap"><h1>💜 복티 바코드</h1><p class="sub">CODE128 · 오프라인 · 화면 스캔용</p><label class="label" for="value">바코드 내용</label><input id="value" value="" placeholder="영문·숫자 입력" autocomplete="off" autocapitalize="characters" spellcheck="false"><p class="hint">영문 대문자 A–Z, 숫자 0–9 · 소문자는 자동 변환 · 최대 60자</p><div class="barcode-panel"><canvas id="barcode" aria-label="생성된 바코드"></canvas></div><div class="error" id="error" role="status"></div><div class="actions"><button id="clear" class="secondary">↻ 초기화</button></div><p class="small">휴대폰 밝기를 높이고, 바코드 양옆의 흰 여백을 확보해 줘.<br>이 파일은 저장 후 인터넷 연결 없이 작동해. 바코드 생성은 실제 상품 등록이나 재고 시스템의 코드 발급과는 별개야.</p></main><script>
if("scrollRestoration" in history)history.scrollRestoration="manual";
window.addEventListener("pageshow",()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();window.scrollTo(0,0)});
const patterns=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
const value=document.getElementById('value'),error=document.getElementById('error');
function encode(str){let codes=[104];for(const ch of str){const cp=ch.charCodeAt(0);if(cp<32||cp>126)throw Error('영문, 숫자, 일반 기호만 입력해 줘.');codes.push(cp-32)}let sum=104;for(let i=1;i<codes.length;i++)sum+=codes[i]*i;codes.push(sum%103,106);return codes.map(n=>patterns[n]).join('')}
function draw(canvas,str){const bits=encode(str),units=[...bits].reduce((s,x)=>s+Number(x),0),quiet=14,scale=3,barHeight=170,txtHeight=35,w=(units+quiet*2)*scale,h=barHeight+txtHeight+22;canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);let x=quiet*scale;for(let i=0;i<bits.length;i++){let width=Number(bits[i])*scale;if(i%2===0){c.fillStyle='#000';c.fillRect(x,10,width,barHeight)}x+=width}c.fillStyle='#111';c.font='bold 22px system-ui, sans-serif';c.textAlign='center';c.fillText(str,w/2,barHeight+34,w-20)}
function render(){const str=value.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,60);if(value.value!==str)value.value=str;error.textContent='';if(!str){const canvas=document.getElementById('barcode');canvas.width=1;canvas.height=1;return}if(str.length>60){error.textContent='최대 60자까지 입력할 수 있어.';return}try{draw(document.getElementById('barcode'),str)}catch(e){error.textContent=e.message}}
value.addEventListener('input',render);document.getElementById('clear').onclick=()=>{value.value='';value.focus();render()};render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
